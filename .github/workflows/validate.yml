name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint --if-present

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check bundle size
        run: |
          SIZE=$(stat -f%z "dist/violet-pool-card.js" 2>/dev/null || stat -c%s "dist/violet-pool-card.js")
          SIZE_KB=$((SIZE / 1024))
          echo "Bundle size: ${SIZE_KB}KB"
          if [ $SIZE_KB -gt 500 ]; then
            echo "::error::Bundle size ${SIZE_KB}KB exceeds 500KB limit"
            exit 1
          fi
          echo "::notice::Bundle size ${SIZE_KB}KB is within 500KB limit"

  integration-keys:
    name: Integration entity keys
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # The card looks its entities up by the translation keys the integration
      # assigns. Those live in another repository, so this job re-reads them
      # and runs the tests against the current list: a key the integration
      # renamed or dropped turns this check red instead of quietly leaving the
      # card without that entity.
      - name: Refresh the keys from the integration
        run: npm run keys:update

      - name: Verify the card's mapping against them
        run: npm test

      - name: Report a drifted fixture
        if: always()
        run: |
          if ! git diff --quiet -- tests/fixtures/integration-entity-keys.json; then
            echo "::notice::The integration has changed its entity keys. Run 'npm run keys:update' and commit the fixture."
          fi
